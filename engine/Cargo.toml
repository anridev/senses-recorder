[package]
name = "senses-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-audio-toolbox = "0.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
